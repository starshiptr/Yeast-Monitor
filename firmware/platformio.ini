; ---------------------------------------------------------------
;  Yeast monitor: one BMP280 -> CSV over serial.
;    pio run -t upload -t monitor
; ---------------------------------------------------------------
[env:esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
monitor_port  = COM3   ; CP210x. If a replug renumbers it: `pio device list`
upload_port   = COM3

; Same lesson as the Spotify build: 460800 drops the CP210x off the bus
; (Windows error 31) on a marginal cable. 115200 is slow but reliable.
upload_speed  = 115200

lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6
